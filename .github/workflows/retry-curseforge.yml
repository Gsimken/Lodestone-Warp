name: Retry CurseForge publication hourly

on:
  schedule:
    - cron: '30 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: retry-curseforge-publication
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-22.04
    steps:
      - name: Start an independent CurseForge publication attempt
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run publish-curseforge.yml --ref "$DEFAULT_BRANCH"

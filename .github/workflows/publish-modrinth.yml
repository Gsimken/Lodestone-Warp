name: Publish to Modrinth

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish; leave empty to use the latest GitHub release'
        required: false
        type: string
permissions:
  actions: write
  contents: read

concurrency:
  group: publish-modrinth-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    env:
      MODRINTH_ID: ${{ vars.MODRINTH_ID }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - name: Enable scheduled retries
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable retry-modrinth.yml --repo "$GITHUB_REPOSITORY"

      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "$REQUESTED_TAG" ]; then
            TAG="$REQUESTED_TAG"
          else
            TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ steps.release.outputs.tag }}

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '25'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Derive release metadata
        id: versions
        run: |
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          MINECRAFT_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2)
          ARCHIVES_NAME=$(grep '^archives_base_name=' gradle.properties | cut -d'=' -f2)
          NOTES_FILE=".github/release-notes/$MOD_VERSION.md"
          if [ ! -f "$NOTES_FILE" ]; then
            NOTES_FILE="build/release-notes.md"
            mkdir -p build
            printf '# Lodestone Warps %s\n\nCompatibility release for Minecraft %s.\n' "$MOD_VERSION" "$MINECRAFT_VERSION" > "$NOTES_FILE"
          fi
          echo "mod_version=$MOD_VERSION" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=$MINECRAFT_VERSION" >> "$GITHUB_OUTPUT"
          echo "jar_file=build/libs/$ARCHIVES_NAME-$MOD_VERSION.jar" >> "$GITHUB_OUTPUT"
          echo "release_notes=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Check whether Modrinth already has this version
        id: existing
        env:
          MOD_VERSION: ${{ steps.versions.outputs.mod_version }}
        run: |
          if [ -z "$MODRINTH_ID" ] || [ -z "$MODRINTH_TOKEN" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "Modrinth credentials are not configured; skipping."
            exit 0
          fi
          VERSIONS=$(curl --fail --silent --show-error \
            "https://api.modrinth.com/v2/project/$MODRINTH_ID/version?include_changelog=false")
          if jq -e --arg version "$MOD_VERSION" '.[] | select(.version_number == $version)' <<< "$VERSIONS" >/dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "complete=true" >> "$GITHUB_OUTPUT"
            echo "Modrinth already contains version $MOD_VERSION; skipping."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release artifact
        if: steps.existing.outputs.publish == 'true'
        run: ./gradlew build --no-daemon

      - name: Publish to Modrinth
        id: publish
        if: steps.existing.outputs.publish == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          files: ${{ steps.versions.outputs.jar_file }}
          name: Lodestone Warps ${{ steps.versions.outputs.mod_version }}
          version: ${{ steps.versions.outputs.mod_version }}
          version-type: release
          changelog-file: ${{ steps.versions.outputs.release_notes }}
          loaders: fabric
          game-versions: ${{ steps.versions.outputs.minecraft_version }}
          game-version-filter: none
          java: 25
          dependencies: |
            fabric-api(required)
          retry-attempts: 1
          fail-mode: fail

      - name: Stop scheduled retries after publication
        if: always() && (steps.existing.outputs.complete == 'true' || steps.publish.outcome == 'success')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable retry-modrinth.yml --repo "$GITHUB_REPOSITORY"

name: Retry Modrinth publication hourly

on:
  schedule:
    - cron: '15 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: retry-modrinth-publication
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-22.04
    steps:
      - name: Start an independent Modrinth publication attempt
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run publish-modrinth.yml --ref "$DEFAULT_BRANCH" --repo "$GITHUB_REPOSITORY"
